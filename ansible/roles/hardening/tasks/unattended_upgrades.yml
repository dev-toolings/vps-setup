---
# Unattended upgrades - security origin only, never reboot automatically.

- name: Install unattended-upgrades and apt-listchanges
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Configure unattended-upgrades (security origins, no auto-reboot)
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Enable the periodic apt timers (update, download, autoclean)
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Ensure the unattended-upgrades service is enabled and running
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: started
    enabled: true
